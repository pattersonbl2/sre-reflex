{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.ingressFrom }}
{{- fail "networkPolicy.ingressFrom must list at least one peer when networkPolicy.enabled (an empty list would allow all sources)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sre-reflex.fullname" . }}
  labels:
    {{- include "sre-reflex.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sre-reflex.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
